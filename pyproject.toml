[project]
name = "foldx-analyzer"
version = "0.2.0"
description = "A desktop GUI to analyze FoldX, PDB, and PLIP data."
authors = [
    {name = "ohatipoglu", email = "78147390+ohatipoglu@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "customtkinter",
    "biopython",
    "python-docx>=0.8.11",
    # plip must be installed separately via conda:
    # conda install -c conda-forge openbabel plip
]

[project.optional-dependencies]
test = [
    "pytest"
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
