[Settings]
# PyMOL yürütülebilir dosyasının tam yolu.
# Örnek (Windows): C:/Program Files/PyMOL/PyMOL.exe
# Örnek (Linux): /usr/bin/pymol
# Sistem PATH'inde varsa sadece 'pymol' yazmak yeterlidir.
pymol_executable_path = pymol

[Graph]
# Grafiklerin ekran üzerinde gösterileceği DPI değeri.
figure_dpi = 100
# PNG olarak kaydedilecek grafiklerin DPI değeri.
save_dpi = 300
# Stabilizasyon/destabilizasyon için enerji eşik değerleri (ddG).
stabilizing_threshold = -0.5
destabilizing_threshold = 0.5

[PDB]
# CYS komşu arama için varsayılan Angstrom eşik değeri.
neighbor_threshold = 6.0
# Disülfür bağı mesafesi için min/max Angstrom değerleri.
disulfide_min_dist = 2.0
disulfide_max_dist = 2.2
